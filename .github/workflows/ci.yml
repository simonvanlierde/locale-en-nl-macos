name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck install.sh copy_locales.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats test/

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and activate the locale
        run: |
          ./install.sh
          unset LC_ALL
          export PATH_LOCALE="$HOME/.locale" LC_TIME=en_NL.UTF-8
          out=$(date -j -f "%Y-%m-%d %H:%M:%S" "2026-01-02 15:04:05" "+%x %X")
          echo "Formatted: $out"
          [ "$out" = "2026-01-02 15:04:05" ]
      - name: Persisted block keeps UTF-8 text handling with LANG unset
        run: |
          ./install.sh --persist="$RUNNER_TEMP/rc"
          env -i HOME="$HOME" PATH="$PATH" bash -c '
            . "$1"
            locale
            locale | grep -q "^LC_CTYPE=.*UTF-8"
            [ "$(date -j -f "%Y-%m-%d %H:%M:%S" "2026-01-02 15:04:05" "+%x %X")" = "2026-01-02 15:04:05" ]
          ' _ "$RUNNER_TEMP/rc"
